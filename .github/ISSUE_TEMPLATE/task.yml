name: Task
description: Claim and scope a focused repository task
title: "[Task] "
labels: []
body:
  - type: input
    id: owner
    attributes:
      label: Owner
      description: Who is responsible for this task?
      placeholder: Josh or Cayden
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: Branch
      description: Create it from the latest main using <name>/<short-task>.
      placeholder: cayden/lead-scraper-fix
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe one focused outcome and what is explicitly out of scope.
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Expected files or areas
      description: Call out shared/high-conflict files before work starts.
      placeholder: |
        src/vendors/smartlead.ts
        src/pipeline/onboarding.ts (coordinate first)
    validations:
      required: true

  - type: checkboxes
    id: coordination
    attributes:
      label: Coordination
      options:
        - label: I posted ownership and branch details in Slack.
          required: true
        - label: I checked for overlapping active work.
          required: true
        - label: I will not perform paid or production mutations without explicit approval.
          required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable completion and validation conditions.
    validations:
      required: true

